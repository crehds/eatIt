---
openapi: 3.0.1
info:
  title: eatIt API
  version: v1
  description: 'REST API for a restaurant: manage the products on the menu and the
    orders placed for them.'
paths:
  "/health":
    get:
      summary: Checks that the API is up
      tags:
      - Health
      responses:
        '200':
          description: the API is up
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/health"
  "/orders":
    get:
      summary: Lists the orders
      tags:
      - Orders
      responses:
        '200':
          description: orders listed
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/order"
    post:
      summary: Creates an order with its items
      tags:
      - Orders
      description: 'Creates the order and one detail per item in a single transaction:
        if anything fails, nothing is saved.'
      parameters: []
      responses:
        '201':
          description: order created
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/order"
        '422':
          description: invalid order or no items
          content:
            application/json:
              schema:
                oneOf:
                - "$ref": "#/components/schemas/validation_errors"
                - "$ref": "#/components/schemas/message"
        '404':
          description: an item references a product that does not exist
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/not_found"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/order_create_payload"
  "/orders/{id}":
    parameters:
    - name: id
      in: path
      description: Order id
      required: true
      schema:
        type: integer
    get:
      summary: Shows an order
      tags:
      - Orders
      responses:
        '200':
          description: order found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/order"
        '404':
          description: order not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/not_found"
    patch:
      summary: Updates an order
      tags:
      - Orders
      description: Only the delivery address can change. The API answers 201 Created.
        PUT /orders/{id} behaves the same way.
      parameters: []
      responses:
        '201':
          description: order updated
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/order"
        '422':
          description: invalid order
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/validation_errors"
        '404':
          description: order not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/not_found"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/order_update_payload"
    delete:
      summary: Deletes an order and its details
      tags:
      - Orders
      responses:
        '200':
          description: order deleted
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/message"
        '404':
          description: order not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/not_found"
  "/products":
    get:
      summary: Lists the products
      tags:
      - Products
      responses:
        '200':
          description: products listed
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/product"
        '401':
          description: the Authorization header holds a token that is not the owner's
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/unauthorized"
    post:
      summary: Creates a product
      tags:
      - Products
      parameters: []
      responses:
        '201':
          description: product created
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/product"
        '422':
          description: invalid product
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/validation_errors"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/product_create_payload"
  "/products/{id}":
    parameters:
    - name: id
      in: path
      description: Product id
      required: true
      schema:
        type: integer
    get:
      summary: Shows a product
      tags:
      - Products
      responses:
        '200':
          description: product found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/product"
        '404':
          description: product not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/not_found"
    patch:
      summary: Updates a product
      tags:
      - Products
      description: PUT /products/{id} behaves the same way.
      parameters: []
      responses:
        '200':
          description: product updated
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/product"
        '422':
          description: invalid product
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/validation_errors"
        '404':
          description: product not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/not_found"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/product_update_payload"
    delete:
      summary: Deletes a product
      tags:
      - Products
      responses:
        '200':
          description: product deleted
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/message"
        '404':
          description: product not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/not_found"
servers:
- url: "/"
security:
- {}
- bearer_auth: []
components:
  securitySchemes:
    bearer_auth:
      type: http
      scheme: bearer
      description: Owner token (OWNER_API_TOKEN). With it, every endpoint works on
        the owner's private data instead of the public demo data.
  schemas:
    unauthorized:
      type: object
      properties:
        error:
          type: string
          example: Invalid token
      required:
      - error
    health:
      type: object
      properties:
        api:
          type: string
          example: OK
      required:
      - api
    product:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Full Rack Ribs
        description:
          type: string
          example: Slow-cooked pork ribs with barbecue sauce.
        price:
          type: integer
          example: 9
        category:
          type: string
          enum:
          - appetizer
          - hamburguer
          - drink
          - crisper
          - side
          - salad
          - dessert
          - ribs
          - tacos
          example: ribs
        demo:
          type: boolean
          description: true for the public demo data, false for the owner's private
            data
          example: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - id
      - name
      - description
      - price
      - category
      - demo
      - created_at
      - updated_at
    product_create_payload:
      type: object
      properties:
        product:
          type: object
          properties:
            name:
              type: string
              example: Full Rack Ribs
            description:
              type: string
              example: Slow-cooked pork ribs with barbecue sauce.
            price:
              type: integer
              example: 9
            category:
              type: string
              enum:
              - appetizer
              - hamburguer
              - drink
              - crisper
              - side
              - salad
              - dessert
              - ribs
              - tacos
              example: ribs
          required:
          - name
          - description
          - price
          - category
      required:
      - product
    product_update_payload:
      type: object
      properties:
        product:
          type: object
          description: Only the fields to change.
          properties:
            name:
              type: string
              example: Full Rack Ribs
            description:
              type: string
              example: Slow-cooked pork ribs with barbecue sauce.
            price:
              type: integer
              example: 9
            category:
              type: string
              enum:
              - appetizer
              - hamburguer
              - drink
              - crisper
              - side
              - salad
              - dessert
              - ribs
              - tacos
              example: ribs
      required:
      - product
    order:
      type: object
      properties:
        id:
          type: integer
          example: 1
        delivery_address:
          type: string
          example: 123 Main Street
        demo:
          type: boolean
          description: true for the public demo data, false for the owner's private
            data
          example: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - id
      - delivery_address
      - demo
      - created_at
      - updated_at
    order_create_payload:
      type: object
      properties:
        order:
          type: object
          properties:
            delivery_address:
              type: string
              example: 123 Main Street
          required:
          - delivery_address
        items:
          type: array
          description: Products in the order. An order without items is rejected.
          items:
            type: object
            properties:
              id:
                type: integer
                description: Product id
                example: 1
              quantity:
                type: integer
                example: 2
            required:
            - id
            - quantity
      required:
      - order
      - items
    order_update_payload:
      type: object
      properties:
        order:
          type: object
          properties:
            delivery_address:
              type: string
              example: 123 Main Street
      required:
      - order
    validation_errors:
      type: object
      description: Validation messages keyed by attribute.
      additionalProperties:
        type: array
        items:
          type: string
      example:
        name:
        - can't be blank
    message:
      type: object
      properties:
        message:
          type: string
      required:
      - message
    not_found:
      type: object
      properties:
        status:
          type: integer
          example: 404
        error:
          type: string
          example: Not Found
      required:
      - status
      - error
